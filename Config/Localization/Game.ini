[CommonSettings]
SourcePath=Content/Localization/Game
DestinationPath=Content/Localization/Game
ManifestName=Game.manifest
ArchiveName=Game.archive
PortableObjectName=Game.po
NativeCulture=en
CulturesToGenerate=en

; Gather stable player-facing text from the runtime module and project config.
[GatherTextStep0]
CommandletClass=GatherTextFromSource
SearchDirectoryPaths=Source/BrokenHorizon
SearchDirectoryPaths=Config
ExcludePathFilters=Config/Localization/*
FileNameFilters=*.cpp
FileNameFilters=*.h
FileNameFilters=*.ini
ShouldGatherFromEditorOnlyData=false

; Gather only shipped Broken Horizon UI and mission assets. Broad marketplace,
; developer, and editor content is intentionally outside the game text target.
[GatherTextStep1]
CommandletClass=GatherTextFromAssets
IncludePathFilters=Content/BrokenHorizon/UI/*
IncludePathFilters=Content/BrokenHorizon/Missions/*
ExcludePathFilters=Content/Developers/*
ExcludePathFilters=Content/Localization/*
PackageFileNameFilters=*.uasset
PackageFileNameFilters=*.umap
bFixBroken=false
ShouldGatherFromEditorOnlyData=false

[GatherTextStep2]
CommandletClass=GenerateGatherManifest

[GatherTextStep3]
CommandletClass=GenerateGatherArchive
bPurgeOldEmptyEntries=true

[GatherTextStep4]
CommandletClass=InternationalizationExport
bExportLoc=true

[GatherTextStep5]
CommandletClass=GenerateTextLocalizationResource
ResourceName=Game.locres

[GatherTextStep6]
CommandletClass=GenerateTextLocalizationReport
DestinationPath=Saved/LocalizationReports
bWordCountReport=true
WordCountReportName=Game.csv
bConflictReport=true
ConflictReportName=GameConflicts.txt
